spring:
  application:
    name: tutorops-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${TUTOROPS_DB_URL}
    username: ${POSTGRES_USER:tutorops}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${TUTOROPS_OIDC_ISSUER:http://localhost:8081/realms/tutorops}
          jwk-set-uri: ${TUTOROPS_OIDC_JWK_SET_URI:http://localhost:8081/realms/tutorops/protocol/openid-connect/certs}
          audiences:
            - ${TUTOROPS_OIDC_AUDIENCE:tutorops-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never

tutorops:
  security:
    oidc:
      api-client-id: ${TUTOROPS_OIDC_API_CLIENT_ID:tutorops-api}
    cors:
      allowed-origin: ${TUTOROPS_CORS_ALLOWED_ORIGIN:http://localhost:5173}
