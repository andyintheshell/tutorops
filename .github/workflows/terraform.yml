name: Terraform Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  schedule:
    - cron: "19 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine Terraform Security scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      required: ${{ steps.scope.outputs.required }}

    steps:
      - name: Check out complete history
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether Terraform Security is required
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(infra/terraform/|\.github/workflows/terraform\.yml$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Not required for these changes
        if: steps.scope.outputs.required == 'false'
        run: echo "Terraform Security is not required because this pull request does not change Terraform configuration or the Terraform Security workflow."

  scan:
    name: Scan Terraform configuration
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: infra/terraform
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform without backend
        working-directory: infra/terraform
        env:
          TF_IN_AUTOMATION: "true"
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: infra/terraform
        env:
          TF_IN_AUTOMATION: "true"
        run: terraform validate -no-color

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          format: sarif
          output: trivy-terraform.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Store scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tutorops-terraform-sarif
          path: trivy-terraform.sarif
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Upload Terraform scan results
    needs: scan
    if: ${{ needs.scan.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Download scan results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tutorops-terraform-sarif

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          sarif_file: trivy-terraform.sarif
          category: tutorops-terraform
