name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Verify application
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            api/target/surefire-reports/
            api/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
