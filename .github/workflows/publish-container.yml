name: Publish API Container

on:
  workflow_run:
    workflows:
      - Container Security
    types:
      - completed

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: publish-api-container-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  verify-checks:
    name: Verify checks for merged commit
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verify required workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          source_workflow_path=".github/workflows/container-security.yml"
          source_workflow="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/actions/workflows/${SOURCE_WORKFLOW_ID}")"
          if ! jq -e --arg expected_path "$source_workflow_path" \
            '.path == $expected_path' <<< "$source_workflow" > /dev/null; then
            echo "ERROR: workflow_run did not originate from $source_workflow_path"
            exit 1
          fi

          required_workflow_names=(CI CodeQL Gitleaks SCA "Container Security")
          required_workflow_paths=(
            "ci.yml"
            "codeql.yml"
            "gitleaks.yml"
            "sca.yml"
            "container-security.yml"
          )
          deadline=$((SECONDS + 1800))

          while (( SECONDS < deadline )); do
            pull_requests="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              "repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls")"
            pull_number="$(jq -r \
              '[.[] | select(.base.ref == "main")] | if length == 1 then .[0].number else empty end' \
              <<< "$pull_requests")"

            if [[ -z "$pull_number" ]]; then
              echo "WAIT: no merged pull request into main found for $HEAD_SHA"
              sleep 15
              continue
            fi

            pull_request="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              "repos/${REPOSITORY}/pulls/${pull_number}")"
            if ! jq -e --arg head_sha "$HEAD_SHA" \
              '.base.ref == "main" and .merged_at != null and .merge_commit_sha == $head_sha' \
              <<< "$pull_request" > /dev/null; then
              echo "WAIT: pull request #$pull_number is not a merged main commit for $HEAD_SHA"
              sleep 15
              continue
            fi

            pull_head_sha="$(jq -r '.head.sha' <<< "$pull_request")"
            dependency_review_runs="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              "repos/${REPOSITORY}/actions/workflows/dependency-review.yml/runs?head_sha=${pull_head_sha}&event=pull_request&per_page=100")"
            if jq -e \
              '[.workflow_runs[] | select(.head_sha == $head_sha and .conclusion == "success")] | length > 0' \
              --arg head_sha "$pull_head_sha" <<< "$dependency_review_runs" > /dev/null; then
              echo "PASS: Dependency Review"
            else
              echo "WAIT: Dependency Review has not completed successfully for pull request #$pull_number"
              sleep 15
              continue
            fi

            all_succeeded=true
            for i in "${!required_workflow_names[@]}"; do
              workflow_name="${required_workflow_names[$i]}"
              workflow_path="${required_workflow_paths[$i]}"
              workflow_runs="$(gh api \
                --header 'Accept: application/vnd.github+json' \
                "repos/${REPOSITORY}/actions/workflows/${workflow_path}/runs?head_sha=${HEAD_SHA}&event=push&per_page=100")"
              if jq -e --arg head_sha "$HEAD_SHA" \
                '[.workflow_runs[] | select(.head_sha == $head_sha and .event == "push" and .conclusion == "success")] | length > 0' \
                <<< "$workflow_runs" > /dev/null; then
                echo "PASS: $workflow_name"
              else
                all_succeeded=false
                echo "WAIT: $workflow_name has not completed successfully for $HEAD_SHA"
              fi
            done

            if [[ "$all_succeeded" == true ]]; then
              exit 0
            fi

            sleep 15
          done

          echo "Required checks did not all pass before the timeout."
          exit 1

  publish:
    name: Publish API image to GHCR
    needs: verify-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out merged commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$OWNER" --password-stdin

      - name: Build API container
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          image="${IMAGE,,}/tutorops-api"
          docker build \
            --pull \
            --file api/Dockerfile \
            --tag "$image:sha-$HEAD_SHA" \
            api

      - name: Push API container tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="${IMAGE,,}/tutorops-api"
          docker push "$image:sha-$HEAD_SHA"

          current_main_sha="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/commits/main" \
            --jq '.sha')"
          if [[ "$HEAD_SHA" == "$current_main_sha" ]]; then
            docker tag "$image:sha-$HEAD_SHA" "$image:latest"
            docker push "$image:latest"
          else
            echo "Skipping latest: $HEAD_SHA is no longer the current main SHA ($current_main_sha)."
          fi
