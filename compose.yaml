services:
  api:
    build:
      context: ./api
    environment:
      TUTOROPS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      TUTOROPS_OIDC_ISSUER: ${TUTOROPS_OIDC_ISSUER:-http://localhost:8081/realms/tutorops}
      TUTOROPS_OIDC_JWK_SET_URI: ${TUTOROPS_OIDC_JWK_SET_URI:-http://keycloak:8080/realms/tutorops/protocol/openid-connect/certs}
      TUTOROPS_CORS_ALLOWED_ORIGIN: ${TUTOROPS_CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-jar", "/app/healthcheck.jar"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: ./web
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-tutorops}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-tutorops-web}
        VITE_API_CLIENT_ID: ${VITE_API_CLIENT_ID:-tutorops-api}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Required}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec '
          { printf "HEAD /health/ready HTTP/1.0\r\n\r\n" >&3;
          grep -q "HTTP/1.0 200" <&3; } 3<>/dev/tcp/localhost/9000 &&
          { printf "GET /realms/tutorops/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&4;
          grep -Eq "HTTP/1\.[01] 200" <&4; } 4<>/dev/tcp/localhost/8080'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  keycloak-data:
  postgres_data:
